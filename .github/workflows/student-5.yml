name: CI/CD Pipeline - Student 5

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'student-5/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'student-5/**'
      - 'docker-compose.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  STUDENT_NUM: 5
  FRONTEND_PORT: 8005
  BACKEND_PORT: 5006
  DATABASE_PORT: 5014

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-5-frontend
          tags: type=ref,event=branch;type=sha

      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-5-backend
          tags: type=ref,event=branch;type=sha

      - uses: docker/metadata-action@v5
        id: meta-database
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-5-database
          tags: type=ref,event=branch;type=sha

      - name: Build images
        run: |
          for service in frontend backend database; do
            if [ -f "student-5/$service/Dockerfile" ]; then
              echo "Building $service..."
              docker buildx build --load -t student-5-$service:${{ github.sha }} ./student-5/$service
              echo "✅ $service built"
            fi
          done

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null && echo "✅ Valid"

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [ build, validate ]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > report.md << EOF
          # Student 5 Build Report
          - Date: $(date)
          - Commit: ${{ github.sha }}
          - Status: ✅ Complete
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: build-report-student-5
          path: report.md
