name: CI/CD Pipeline - Student 2

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'student-2/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-2.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'student-2/**'
      - 'docker-compose.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  STUDENT_NUM: 2
  FRONTEND_PORT: 8002
  BACKEND_PORT: 5003
  DATABASE_PORT: 5011

jobs:
  # Stage 1: Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-${{ env.STUDENT_NUM }}-frontend
          tags: |
            type=ref,event=branch
            type=sha

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-${{ env.STUDENT_NUM }}-backend
          tags: |
            type=ref,event=branch
            type=sha

      - name: Extract metadata for database
        id: meta-database
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-${{ env.STUDENT_NUM }}-database
          tags: |
            type=ref,event=branch
            type=sha

      - name: Check if frontend Dockerfile exists
        id: check-frontend
        run: |
          if [ -f "student-2/frontend/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push frontend
        if: steps.check-frontend.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./student-2/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if backend Dockerfile exists
        id: check-backend
        run: |
          if [ -f "student-2/backend/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        if: steps.check-backend.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./student-2/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if database Dockerfile exists
        id: check-database
        run: |
          if [ -f "student-2/database/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push database
        if: steps.check-database.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./student-2/database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-database.outputs.tags }}
          labels: ${{ steps.meta-database.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Student ${{ env.STUDENT_NUM }} - Build Complete"
          echo "Frontend: ${{ steps.check-frontend.outputs.exists }}"
          echo "Backend: ${{ steps.check-backend.outputs.exists }}"
          echo "Database: ${{ steps.check-database.outputs.exists }}"

  # Stage 2: Validate configuration
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config > /dev/null
          echo "✅ docker-compose.yml is valid"

      - name: Check Student ${{ env.STUDENT_NUM }} services in compose
        run: |
          echo "Checking for student-${{ env.STUDENT_NUM }} services..."
          docker compose config | grep -q "student-${{ env.STUDENT_NUM }}-frontend" && echo "✅ Frontend service found" || echo "⚠️  Frontend service not configured yet"
          docker compose config | grep -q "student-${{ env.STUDENT_NUM }}-backend" && echo "✅ Backend service found" || echo "⚠️  Backend service not configured yet"
          docker compose config | grep -q "student-${{ env.STUDENT_NUM }}-database" && echo "✅ Database service found" || echo "⚠️  Database service not configured yet"

  # Stage 3: Test if services exist and can build
  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build student-${{ env.STUDENT_NUM }} services
        run: |
          if [ -d "student-2/frontend" ] && [ -f "student-2/frontend/Dockerfile" ]; then
            echo "Building frontend..."
            docker buildx build --load -t student-2-frontend:test ./student-2/frontend
            echo "✅ Frontend built"
          fi
          
          if [ -d "student-2/backend" ] && [ -f "student-2/backend/Dockerfile" ]; then
            echo "Building backend..."
            docker buildx build --load -t student-2-backend:test ./student-2/backend
            echo "✅ Backend built"
          fi
          
          if [ -d "student-2/database" ] && [ -f "student-2/database/Dockerfile" ]; then
            echo "Building database..."
            docker buildx build --load -t student-2-database:test ./student-2/database
            echo "✅ Database built"
          fi

  # Stage 4: Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfiles for issues
        run: |
          echo "Scanning Dockerfiles..."
          for dockerfile in student-2/*/Dockerfile; do
            if [ -f "$dockerfile" ]; then
              echo "Checking $dockerfile..."
              # Basic checks
              ! grep -q "privileged: true" "$dockerfile" || echo "⚠️  privileged mode in $dockerfile"
              ! grep -q ":latest" "$dockerfile" || echo "⚠️  Using :latest tag in $dockerfile"
            fi
          done
          echo "✅ Quality checks complete"

  # Stage 5: Report generation
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [ build, validate, build-test, quality ]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build report
        run: |
          cat > build-report-student-2.md << EOF
          # Student 2 - CI/CD Build Report
          
          **Date:** $(date)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}
          
          ## Configuration
          - Frontend Port: ${{ env.FRONTEND_PORT }}
          - Backend Port: ${{ env.BACKEND_PORT }}
          - Database Port: ${{ env.DATABASE_PORT }}
          
          ## Build Status
          - ✅ Build stage completed
          - ✅ Configuration validated
          - ✅ Code quality checks passed
          
          ## Next Steps
          1. Implement CRUD operations
          2. Add AI-Mode integration
          3. Implement cross-database API calls
          4. Add health check endpoints
          5. Test in integrated system
          
          ## Docker Compose Integration
          Update your docker-compose.yml services for:
          - student-2-frontend (port 8002)
          - student-2-backend (port 5003)
          - student-2-database (port 5011)
          
          EOF
          cat build-report-student-2.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-student-2
          path: build-report-student-2.md
          retention-days: 30
