name: CI/CD Pipeline - Student 1 (Enrolment)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend-service/**'
      - 'enrolment-service/**'
      - 'database-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend-service/**'
      - 'enrolment-service/**'
      - 'database-service/**'
      - 'docker-compose.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # Stage 1: Build and validate services
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend-service
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-1-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Extract metadata for enrolment-service
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-1-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Extract metadata for database-service
        id: meta-database
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/student-1-database
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push frontend-service
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push enrolment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: enrolment-service/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push database-service
        uses: docker/build-push-action@v5
        with:
          context: ./database-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-database.outputs.tags }}
          labels: ${{ steps.meta-database.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 2: Validate Docker Compose configuration
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v3

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config > /dev/null
          echo "✅ docker-compose.yml is valid"

      - name: Check service definitions
        run: |
          echo "Checking service definitions..."
          docker compose config | grep -E "frontend-service|enrolment-service|database-service|shared-index"
          echo "✅ All expected services found"

  # Stage 3: Test Docker Compose build
  compose-test:
    name: Test Docker Compose Build
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services with docker-compose
        run: |
          docker compose build \
            frontend-service \
            enrolment-service \
            database-service
          echo "✅ All services built successfully"

      - name: Start services and run health checks
        run: |
          echo "Starting services..."
          docker compose up -d
          
          echo "Waiting for services to be healthy..."
          sleep 10
          
          echo "Checking frontend-service (port 8001)..."
          curl -f http://localhost:8001/ || exit 1
          echo "✅ Frontend is responding"
          
          echo "Checking enrolment-service (port 5001)..."
          curl -f http://localhost:5001/ || exit 1
          echo "✅ Backend is responding"
          
          echo "Checking database-service (port 5002)..."
          curl -f http://localhost:5002/students || exit 1
          echo "✅ Database API is responding"
          
          echo "Checking shared-index (port 9000)..."
          curl -f http://localhost:9000/ || exit 1
          echo "✅ Shared index is responding"

      - name: Verify service connectivity
        run: |
          echo "Testing inter-service communication..."
          docker compose exec -T enrolment-service curl -f http://database-service:5002/students || exit 1
          echo "✅ Services can communicate"

      - name: View service logs
        if: failure()
        run: |
          echo "=== Frontend Logs ==="
          docker compose logs frontend-service || true
          echo "=== Backend Logs ==="
          docker compose logs enrolment-service || true
          echo "=== Database Logs ==="
          docker compose logs database-service || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down
          docker system prune -f

  # Stage 4: Code quality and security checks
  quality-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Dockerfile linting
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: enrolment-service/Dockerfile
          ignore: DL3008,DL3009

      - name: Run Dockerfile linting (frontend)
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: frontend-service/Dockerfile
          ignore: DL3008,DL3009

      - name: Run Dockerfile linting (database)
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: database-service/Dockerfile
          ignore: DL3008,DL3009

      - name: Check for security vulnerabilities in docker-compose.yml
        run: |
          echo "Checking for common security issues..."
          ! grep -r "privileged: true" docker-compose.yml || echo "⚠️  Warning: privileged mode detected"
          ! grep -r ":latest" docker-compose.yml || echo "⚠️  Warning: Using :latest tags (use pinned versions)"
          echo "✅ Basic security checks passed"

  # Stage 5: Generate reports
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [ build, validate-compose, compose-test ]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build report
        run: |
          cat > build-report.md << EOF
          # Student 1 - Build Report
          
          **Build Date:** $(date)
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Trigger:** ${{ github.event_name }}
          
          ## Services Built
          - ✅ frontend-service (port 8001)
          - ✅ enrolment-service (port 5001)
          - ✅ database-service (port 5002)
          
          ## Validation Results
          - ✅ Docker images built successfully
          - ✅ docker-compose.yml validated
          - ✅ Services start and respond to health checks
          - ✅ Inter-service communication working
          - ✅ Code quality checks passed
          
          ## Next Steps
          - Deploy to staging
          - Run integration tests
          - Deploy to production (if on main branch)
          
          EOF
          cat build-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-student-1
          path: build-report.md
          retention-days: 30

  # Stage 6: Deployment (optional - on main branch only)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build, validate-compose, compose-test, quality-checks ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment notification
        run: |
          echo "🚀 Deployment started for Student 1 services"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo ""
          echo "Services ready for deployment:"
          echo "  - frontend-service"
          echo "  - enrolment-service"
          echo "  - database-service"
          
          # In production, you would:
          # 1. SSH into deployment server
          # 2. Pull latest images from registry
          # 3. Run docker compose up
          # 4. Run smoke tests
          # 5. Notify team

      - name: Create deployment summary
        run: |
          cat > deployment-summary.txt << EOF
          DEPLOYMENT SUMMARY - Student 1
          ==============================
          
          Status: Ready for deployment
          Timestamp: $(date)
          Commit: ${{ github.sha }}
          
          Services:
          - frontend-service (Nginx)
          - enrolment-service (Flask)
          - database-service (SQLite)
          
          Next: Deploy to production server
          EOF
          cat deployment-summary.txt

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary-student-1
          path: deployment-summary.txt
          retention-days: 30
