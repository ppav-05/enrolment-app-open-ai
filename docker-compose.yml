version: "3.9"

services:
    # ============================================
    # SHARED INFRASTRUCTURE
    # ============================================

    # Shared Index Portal - Single Entry Point (Point 1)
    shared-index:
        build:
            context: ./shared-index-service
        container_name: shared-index
        ports:
            - "9000:80"
        depends_on:
            - frontend-service
            - enrolment-service
        networks:
            - enrolment-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        labels:
            - "com.release0.service=shared-index"
            - "com.release0.version=1.0"

    # ============================================
    # STUDENT 1: ENROLMENT SERVICE (Lab 04 Base)
    # ============================================

    # Enrolment Frontend - Web UI
    frontend-service:
        build:
            context: ./frontend-service
        container_name: frontend-service
        ports:
            - "8001:80"
        depends_on:
            - enrolment-service
        networks:
            - enrolment-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        labels:
            - "com.release0.student=1"
            - "com.release0.service=frontend"

    # Enrolment Backend - Flask API with AI Integration (Point 5)
    enrolment-service:
        build:
            context: .
            dockerfile: enrolment-service/Dockerfile
        container_name: enrolment-service
        ports:
            - "5001:5001"
        environment:
            # Database Configuration
            DATABASE_SERVICE_URL: http://database-service:5002
            
            # AI/Ollama Configuration (Point 5)
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
            OLLAMA_ENABLED: "true"
            OLLAMA_TIMEOUT: "30"
            
            # Cross-Database API Configuration (Point 3)
            STUDENT_1_DB_URL: http://database-service:5002
            STUDENT_2_DB_URL: http://student-2-database:5011
            STUDENT_3_DB_URL: http://student-3-database:5012
            STUDENT_4_DB_URL: http://student-4-database:5013
            STUDENT_5_DB_URL: http://student-5-database:5014
            
            # Flask Configuration
            FLASK_ENV: production
            FLASK_DEBUG: "0"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - database-service
        networks:
            - enrolment-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5001/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        labels:
            - "com.release0.student=1"
            - "com.release0.service=backend"
            - "com.release0.ai-enabled=true"

    # Enrolment Database - SQLite with API
    database-service:
        build:
            context: ./database-service
        container_name: database-service
        ports:
            - "5002:5002"
        volumes:
            - database_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - database-service
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5002/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        labels:
            - "com.release0.student=1"
            - "com.release0.service=database"

    # ============================================
    # STUDENT 2: PLACEHOLDER SERVICES
    # ============================================
    # Replace with actual services when implemented

    student-2-frontend:
        image: nginx:alpine
        container_name: student-2-frontend
        ports:
            - "8002:80"
        volumes:
            - ./shared-index-service/css:/usr/share/nginx/html/css:ro
        networks:
            - enrolment-network
        restart: unless-stopped
        command: sh -c 'echo "<h1>Student 2 - Coming Soon</h1><p>Frontend not yet implemented</p>" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"'
        labels:
            - "com.release0.student=2"
            - "com.release0.service=frontend"
            - "com.release0.status=placeholder"

    # Placeholder: Will be replaced with actual backend service
    student-2-backend:
        image: nginx:alpine
        container_name: student-2-backend
        ports:
            - "5003:80"
        networks:
            - enrolment-network
        restart: unless-stopped
        command: sh -c 'echo "{\"status\":\"placeholder\"}" > /usr/share/nginx/html/index.json && nginx -g "daemon off;"'
